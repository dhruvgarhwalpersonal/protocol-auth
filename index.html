<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protocol</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      color: #e2e2ea;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(ellipse 120% 80% at 50% -10%, rgba(74, 143, 255, 0.07) 0%, transparent 60%),
        radial-gradient(ellipse 80% 60% at 90% 20%, rgba(120, 80, 255, 0.05) 0%, transparent 50%),
        radial-gradient(ellipse 60% 80% at 10% 80%, rgba(30, 120, 200, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse 100% 50% at 50% 100%, rgba(10, 10, 30, 0.8) 0%, transparent 70%),
        linear-gradient(160deg, #0d0d18 0%, #0a0a14 40%, #080810 70%, #06060e 100%),
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255,255,255,0.008) 40px, rgba(255,255,255,0.008) 41px),
        repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.005) 40px, rgba(255,255,255,0.005) 41px);
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      top: -200px; left: 50%; transform: translateX(-50%);
      background: radial-gradient(circle, rgba(74, 143, 255, 0.04) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    .card {
      position: relative; z-index: 1;
      background: rgba(255,255,255,0.026);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 48px 40px;
      width: 92%; max-width: 380px;
      display: flex; flex-direction: column; align-items: center;
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
      box-shadow:
        0 0 0 0.5px rgba(255,255,255,0.04) inset,
        0 32px 80px rgba(0,0,0,0.6),
        0 8px 24px rgba(0,0,0,0.4),
        0 0 60px rgba(74,143,255,0.04);
    }

    .brand {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      margin-bottom: 32px;
    }

    .brand img {
      width: 36px; height: 36px;
      object-fit: contain;
      opacity: 0.9;
    }

    .brand-name {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.55) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .divider {
      width: 100%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
      margin-bottom: 28px;
    }

    .heading {
      font-size: 13.5px;
      font-weight: 300;
      color: rgba(210,210,230,0.5);
      margin-bottom: 24px;
      letter-spacing: 0.01em;
      text-align: center;
      line-height: 1.6;
    }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      width: 100%; padding: 12px 20px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
      cursor: pointer;
      background: rgba(255,255,255,0.055);
      color: rgba(255,255,255,0.85);
      transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
      position: relative; overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, transparent 100%);
      opacity: 0; transition: opacity 0.2s;
    }

    .btn:hover:not(:disabled)::before { opacity: 1; }
    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.17);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .btn:active:not(:disabled) { transform: translateY(0); }

    /* Disabled: only dim the text label, never the Google logo */
    .btn:disabled { cursor: not-allowed; }
    .btn:disabled .btn-label { opacity: 0.35; }

    /* Google logo always full opacity no matter what */
    .google-logo {
      flex-shrink: 0;
      opacity: 1 !important;
      position: relative;
      z-index: 1;
    }

    .btn-label {
      display: flex; align-items: center; gap: 6px;
      transition: opacity 0.2s;
    }

    .status {
      margin-top: 18px;
      font-size: 12px;
      font-weight: 400;
      min-height: 18px;
      line-height: 1.6;
      letter-spacing: 0.01em;
      text-align: center;
      width: 100%;
    }
    .status.error   { color: #ff6b6b; }
    .status.success { color: #4ade80; }
    .status.info    { color: rgba(150,180,255,0.8); }

    .spinner {
      display: inline-block; width: 13px; height: 13px;
      border: 1.5px solid rgba(150,180,255,0.2);
      border-top-color: rgba(150,180,255,0.8);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .close-hint {
      margin-top: 20px;
      font-size: 11.5px;
      font-weight: 300;
      color: rgba(200,200,220,0.28);
      display: none;
      line-height: 1.7;
      text-align: center;
    }

    .footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.05);
      font-size: 10.5px;
      font-weight: 300;
      color: rgba(255,255,255,0.15);
      letter-spacing: 0.03em;
      text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>
<div class="card">

  <div class="brand">
    <img src="logo.png" alt="" onerror="this.style.display='none'" />
    <div class="brand-name">PROTOCOL</div>
  </div>

  <div class="divider"></div>

  <p class="heading" id="sub">Sign in to your desktop app</p>

  <button class="btn" id="sign-in-btn" onclick="doGoogleSignIn()">
    <!--
      Google logo is OUTSIDE .btn-label so it is never caught by the
      disabled opacity rule — it stays vivid at all times.
    -->
    <svg class="google-logo" width="16" height="16" viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    <!-- Only this span gets dimmed when the button is disabled -->
    <span class="btn-label" id="btn-label">Continue with Google</span>
  </button>

  <div class="status" id="status"></div>
  <div class="close-hint" id="close-hint">You can safely close this tab — Protocol is now signed in.</div>

  <div class="footer">Secure authentication via Google</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
  var FIREBASE_CONFIG = {
    apiKey:            "AIzaSyC5TA-7Tnvxomhr_0wqUXxx_0cDjYjFslk",
    authDomain:        "protocol-app-68172.firebaseapp.com",
    projectId:         "protocol-app-68172",
    storageBucket:     "protocol-app-68172.firebasestorage.app",
    messagingSenderId: "132607409250",
    appId:             "1:132607409250:web:01aef039ac682e3e78653b",
    measurementId:     "G-772FJNTT10"
  };

  firebase.initializeApp(FIREBASE_CONFIG);
  var fbAuth = firebase.auth();
  var fbDb   = firebase.firestore();

  var sessionId  = new URLSearchParams(window.location.search).get('session');
  var _unsubscribe = null; // Firestore real-time listener handle

  function setStatus(msg, type) {
    var el = document.getElementById('status');
    el.className = 'status ' + (type || '');
    el.innerHTML = msg;
  }

  function setBtnLabel(html) {
    document.getElementById('btn-label').innerHTML = html;
  }

  if (!sessionId) {
    document.getElementById('sub').textContent = 'Opened automatically by Protocol desktop.';
    document.getElementById('sign-in-btn').disabled = true;
    setStatus('No session found. Open Protocol and click "Continue with Google".', 'error');
  } else {
    /*
      Use a real-time Firestore listener instead of polling.
      This means cancellation from the desktop app closes the tab
      instantly the moment the status field changes to 'cancelled'.
    */
    _unsubscribe = fbDb.collection('googleSessions').doc(sessionId)
      .onSnapshot(function(snap) {
        if (!snap.exists) return;
        var status = snap.data().status;
        if (status === 'cancelled') {
          if (_unsubscribe) { _unsubscribe(); _unsubscribe = null; }
          setStatus('Sign-in was cancelled from the app.', 'error');
          setTimeout(function() { window.close(); }, 400);
        }
      }, function() { /* ignore listener errors silently */ });
  }

  async function doGoogleSignIn() {
    if (!sessionId) return;
    var btn = document.getElementById('sign-in-btn');
    btn.disabled = true;
    setBtnLabel('<span class="spinner"></span> Opening…');
    setStatus('', '');

    try {
      var provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });

      var result = await fbAuth.signInWithPopup(provider);
      var user   = result.user;

      var googleIdToken = result.credential ? result.credential.idToken : null;
      if (!googleIdToken) {
        throw new Error('Could not retrieve Google credential. Please try again.');
      }

      /* Stop listening — sign-in succeeded, no need to watch for cancel */
      if (_unsubscribe) { _unsubscribe(); _unsubscribe = null; }

      setBtnLabel('<span class="spinner"></span> Finishing…');

      await fbDb.collection('googleSessions').doc(sessionId).update({
        status:      'complete',
        idToken:     googleIdToken,
        email:       user.email,
        displayName: user.displayName || ''
      });

      await fbAuth.signOut();

      document.getElementById('sub').textContent = "You're signed in.";
      setStatus('All done. Protocol desktop is ready.', 'success');
      document.getElementById('close-hint').style.display = 'block';
      btn.style.display = 'none';

      setTimeout(function() { window.close(); }, 1000);

    } catch (e) {
      if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') {
        setStatus('Sign-in cancelled.', 'error');
        setBtnLabel('Continue with Google');
        btn.disabled = false;
        return;
      }
      try {
        await fbDb.collection('googleSessions').doc(sessionId).update({
          status: 'error', errorMessage: e.message || 'Google sign-in failed.'
        });
      } catch (e2) {}
      setStatus('Error: ' + (e.message || 'Unknown error.'), 'error');
      setBtnLabel('Continue with Google');
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
