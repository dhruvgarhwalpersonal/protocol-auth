<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protocol — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      color: #e2e2ea;
      overflow: hidden;
      position: relative;

      /* 7-layer dark textured gradient */
      background:
        radial-gradient(ellipse 120% 80% at 50% -10%, rgba(74, 143, 255, 0.07) 0%, transparent 60%),
        radial-gradient(ellipse 80% 60% at 90% 20%, rgba(120, 80, 255, 0.05) 0%, transparent 50%),
        radial-gradient(ellipse 60% 80% at 10% 80%, rgba(30, 120, 200, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse 100% 50% at 50% 100%, rgba(10, 10, 30, 0.8) 0%, transparent 70%),
        linear-gradient(160deg, #0d0d18 0%, #0a0a14 40%, #080810 70%, #06060e 100%),
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255,255,255,0.008) 40px, rgba(255,255,255,0.008) 41px),
        repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.005) 40px, rgba(255,255,255,0.005) 41px);
    }

    /* Subtle noise texture overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }

    /* Ambient glow orbs */
    body::after {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      top: -200px; left: 50%; transform: translateX(-50%);
      background: radial-gradient(circle, rgba(74, 143, 255, 0.04) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    .card {
      position: relative; z-index: 1;
      background: rgba(255,255,255,0.028);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 52px 44px;
      max-width: 400px; width: 92%;
      text-align: center;
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
      box-shadow:
        0 0 0 0.5px rgba(255,255,255,0.04) inset,
        0 32px 80px rgba(0,0,0,0.6),
        0 8px 24px rgba(0,0,0,0.4),
        0 0 60px rgba(74,143,255,0.04);
    }

    .logo {
      font-family: 'Syncopate', sans-serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.08em;
      color: #fff;
      margin-bottom: 36px;
      opacity: 0.9;
    }

    .logo span {
      background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.6) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    h1 {
      font-size: 20px;
      font-weight: 500;
      color: #f0f0f6;
      letter-spacing: -0.01em;
      margin-bottom: 10px;
    }

    .sub {
      font-size: 13.5px;
      font-weight: 300;
      color: rgba(200,200,220,0.45);
      margin-bottom: 36px;
      line-height: 1.7;
      letter-spacing: 0.01em;
    }

    .divider {
      width: 32px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      margin: 0 auto 36px;
    }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 13px 20px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, transparent 100%);
      opacity: 0; transition: opacity 0.2s;
    }

    .btn:hover:not(:disabled)::before { opacity: 1; }
    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.18);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .btn-google {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.88);
    }

    .status {
      margin-top: 22px;
      font-size: 13px;
      font-weight: 400;
      min-height: 18px;
      line-height: 1.6;
      letter-spacing: 0.01em;
    }
    .status.error   { color: #ff6b6b; }
    .status.success { color: #4ade80; }
    .status.info    { color: rgba(150,180,255,0.8); }

    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 1.5px solid rgba(150,180,255,0.2);
      border-top-color: rgba(150,180,255,0.8);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .close-hint {
      margin-top: 28px;
      font-size: 12.5px;
      font-weight: 300;
      color: rgba(200,200,220,0.35);
      display: none;
      line-height: 1.7;
      letter-spacing: 0.01em;
    }

    .footer {
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.05);
      font-size: 11.5px;
      font-weight: 300;
      color: rgba(255,255,255,0.18);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="logo"><span>PROTOCOL</span></div>

  <h1 id="title">Sign in to continue</h1>
  <p class="sub" id="sub">Complete sign-in to your Protocol desktop app.</p>
  <div class="divider"></div>

  <button class="btn btn-google" id="sign-in-btn" onclick="doGoogleSignIn()">
    <svg width="18" height="18" viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    Continue with Google
  </button>

  <div class="status" id="status"></div>
  <div class="close-hint" id="close-hint">You can safely close this tab — Protocol is now signed in.</div>

  <div class="footer">Secure authentication via Google</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
  var FIREBASE_CONFIG = {
    apiKey:            "AIzaSyC5TA-7Tnvxomhr_0wqUXxx_0cDjYjFslk",
    authDomain:        "protocol-app-68172.firebaseapp.com",
    projectId:         "protocol-app-68172",
    storageBucket:     "protocol-app-68172.firebasestorage.app",
    messagingSenderId: "132607409250",
    appId:             "1:132607409250:web:01aef039ac682e3e78653b",
    measurementId:     "G-772FJNTT10"
  };

  firebase.initializeApp(FIREBASE_CONFIG);
  var fbAuth = firebase.auth();
  var fbDb   = firebase.firestore();

  var sessionId = new URLSearchParams(window.location.search).get('session');

  function setStatus(msg, type) {
    var el = document.getElementById('status');
    el.className = 'status ' + (type || '');
    el.innerHTML = msg;
  }

  if (!sessionId) {
    document.getElementById('sub').textContent = 'This page is opened automatically by the Protocol desktop app.';
    document.getElementById('sign-in-btn').disabled = true;
    setStatus('No session found. Open Protocol and click "Continue with Google".', 'error');
  }

  async function doGoogleSignIn() {
    if (!sessionId) return;
    var btn = document.getElementById('sign-in-btn');
    btn.disabled = true;
    setStatus('<span class="spinner"></span>Opening Google sign-in\u2026', 'info');

    try {
      var provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });

      var result = await fbAuth.signInWithPopup(provider);
      var user   = result.user;

      setStatus('<span class="spinner"></span>Finishing sign-in\u2026', 'info');

      var idToken = await user.getIdToken();

      await fbDb.collection('googleSessions').doc(sessionId).update({
        status:      'complete',
        idToken:     idToken,
        email:       user.email,
        displayName: user.displayName || ''
      });

      await fbAuth.signOut();

      setStatus('Signed in successfully.', 'success');
      document.getElementById('close-hint').style.display = 'block';
      document.getElementById('title').textContent = 'All done';
      document.getElementById('sub').textContent = 'Protocol desktop is now signed in.';
      btn.style.display = 'none';

    } catch (e) {
      if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') {
        setStatus('Sign-in cancelled.', 'error');
        btn.disabled = false;
        return;
      }
      try {
        await fbDb.collection('googleSessions').doc(sessionId).update({
          status: 'error', errorMessage: e.message || 'Google sign-in failed.'
        });
      } catch (e2) {}
      setStatus('Error: ' + (e.message || 'Unknown error.'), 'error');
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
